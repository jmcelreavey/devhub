[package]
name = "devhub-desktop"
version = "2.0.0"
description = "DevHub desktop shell"
authors = ["DevHub"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devhub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tempfile = "3"

[features]
# Ships a devtools-enabled webview. Debug builds get it automatically; this is
# for a release build you deliberately want to inspect.
devtools = ["tauri/devtools"]

[profile.release]
# The bundle is dominated by the Node runtime and Next output, so the usual
# binary-shrinking knobs buy little. `panic = "abort"` is the exception worth
# taking: a panic in the shell must not unwind past the point where the sidecar
# process group gets cleaned up, and aborting makes that failure loud.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
