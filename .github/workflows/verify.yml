name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      REPO_ROOT: ${{ github.workspace }}
      NOTES_DIR: ${{ github.workspace }}/notes
      DOCS_DIR: ${{ github.workspace }}/docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for internal-name / secret leaks
        run: bash scripts/scan-leaks.sh tree

      - name: Setup dashboard
        uses: ./.github/actions/dashboard-setup

      - name: Check generated core routes
        run: |
          node scripts/gen-core-routes.mjs
          git diff --exit-code -- apps/core/src/http/routes.generated.ts apps/core/src/http/namespaces.generated.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check documentation links
        run: npm run docs:links

      # Vendored skills are third-party code that syncs to every machine and
      # runs with the agent's full permissions. This asserts the two properties
      # skills/vendor/NOTICE.md claims - complete provenance, and scripts that
      # are offline and stdlib-only - so a re-vendor cannot quietly widen what
      # they can reach. Runs early because it is seconds, and a failure here
      # should not wait behind a full build.
      #
      # Behavioural evals for the same skills are vitest files, so they already
      # run inside `npm run verify` below. They need python3, which
      # ubuntu-latest has; on a runner without it they skip rather than fail.
      - name: Verify vendored skills
        run: npm run skills:verify-vendor --prefix apps/ui

      # The desktop staging and supervisor scripts are plain .mjs outside the
      # dashboard's vitest project, so `verify` never saw them. They were
      # therefore only exercised by a release build — which is a 25-minute,
      # three-platform way to find out that a staging rule is wrong.
      - name: Test workspace paths and checkout rebuild
        run: node --test scripts/workspace-paths.test.mjs scripts/checkout-rebuild.test.mjs

      - name: Test desktop scripts
        run: npm run desktop:test

      - name: Run verify
        run: npm run verify

      - name: Build dashboard
        run: npm run verify:build --prefix apps/ui

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: apps/ui

      - name: Smoke test the built app
        env:
          PLAYWRIGHT_PORT: "41337"
        run: npm run test:e2e --prefix apps/ui

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/ui/playwright-report/
          retention-days: 7
