name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    env:
      # verify runs tsc before build; skip Next's duplicate TS pass (see next.config.ts).
      DEVHUB_SKIP_NEXT_TYPECHECK: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      REPO_ROOT: ${{ github.workspace }}
      NOTES_DIR: ${{ github.workspace }}/notes
      DOCS_DIR: ${{ github.workspace }}/docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for internal-name / secret leaks
        run: bash scripts/scan-leaks.sh tree

      - name: Setup dashboard
        uses: ./.github/actions/dashboard-setup

      - name: Run verify
        run: npm run verify --prefix dashboard

      # `verify` (lint + tsc + vitest + build) can go green on a dashboard that
      # throws on mount: the vitest environment is `node` and there are 2
      # component tests for 185 components. Nothing above this line renders a
      # page. These smoke journeys are the only thing that does.
      # WebKit is here because the desktop app renders in the OS webview
      # (WKWebView / WebKitGTK), not Blink. Chromium-only CI would let an
      # engine-level regression ship straight into the installer.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: dashboard

      - name: Smoke test the built app
        run: npm run test:e2e --prefix dashboard

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7
