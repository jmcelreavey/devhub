name: Dashboard Setup
description: Shared DevHub dashboard bootstrap for CI (Node, safe-chain, npm ci).

inputs:
  node-version-file:
    description: Path to .nvmrc for Node version.
    required: false
    default: .nvmrc

runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Setup safe-chain
      shell: bash
      run: |
        npm i -g @aikidosec/safe-chain@1.1.10
        safe-chain setup-ci

    - name: Install workspace dependencies
      shell: bash
      run: npm ci

    - name: Configure DevHub content paths
      shell: bash
      run: |
        # Point the checkout server at the fixture content paths.
        {
          echo "REPO_ROOT=${{ github.workspace }}"
          echo "NOTES_DIR=${{ github.workspace }}/notes"
          echo "DOCS_DIR=${{ github.workspace }}/docs"
        } >> "$GITHUB_ENV"
